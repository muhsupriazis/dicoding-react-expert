<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
    <style>
      * {
        font-family: 'Inter', sans-serif;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      header {
        padding: 1rem 0;
      }

      a {
        color: #00595c;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      h1 {
        font-size: 1.4rem;
        color: #5d6b66;
      }

      h2, h3  {
        font-size: 1rem;
        color:#5d6b66;
      }

      .content {
        font-size: .9rem;
        padding: .5rem 0;
      }

      .user-name {
        font-size: .9rem;
        font-weight: bold;
        color: #00595c;
      }

      .comment-form {
        display: flex;
        flex-direction: column;
      }

      .comments {
        margin: 1rem 0;
      }

      .comments h2 {
        padding: 1rem 0;
      }

      .comment-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form {
        max-width: 400px;
        margin: auto;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .form-add {
        display: flex;
        flex-direction: column;
        max-width: 600px;
        margin: 3rem auto;
      }
    </style>
    <title>Vite + React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
